<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paper">
<meta name="theme-color" content="#ebebe6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Paper</title>
<style>
/* Layout: e-paper tablet. The sheet fills the whole screen; a thin tool rail overlays the left margin and folds into one round button. */
:root{
  --paper:#ebebe6; --fg:#111111; --muted:#5f615c; --line:#b3b4ae; --soft:#d9d9d3;
  --ui:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --railw:60px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--paper);color:var(--fg);font:14px/1.4 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

.page{position:absolute;inset:0;touch-action:none;overflow:hidden;
  top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.rail{position:absolute;z-index:10;left:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:8px}
.rail::-webkit-scrollbar{display:none}
.sep{width:26px;height:1px;background:var(--line);margin:7px 0;flex:0 0 auto}
.grow{flex:1 1 auto;min-height:8px}
.tb{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;cursor:pointer;padding:0}
.tb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed="true"]{background:var(--fg);color:var(--paper)}
.tb:disabled{opacity:.25;cursor:default}
.tb:focus-visible,.btn:focus-visible,.opt:focus-visible,.nb-row:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#bRail{border:1.5px solid var(--fg);border-radius:50%;width:42px;height:42px;margin-bottom:6px;background:var(--paper)}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--fg);display:grid;place-items:center}
.swatch i{display:block;border-radius:50%;background:var(--paper)}
.count{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;padding:4px 0;text-align:center;min-width:44px}

.head{position:absolute;z-index:9;top:env(safe-area-inset-top,0px);left:calc(var(--railw) + env(safe-area-inset-left,0px));right:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.nbtitle{border:0;background:none;font:600 15px/1.2 var(--ui);padding:0;cursor:pointer;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font:12px/1.2 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:var(--fg);font-weight:600}

.app.collapsed .rail{bottom:auto;background:transparent;border:0}
.app.collapsed .rail > :not(#bRail){display:none}
.app.collapsed #bRail{margin:0}
.app.collapsed .head{display:none}

.hint{position:absolute;left:0;right:0;top:40%;text-align:center;color:#6c6e69;font:15px/1.5 var(--ui);pointer-events:none;padding:0 24px}
.hint b{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#8b8d87;margin-bottom:4px}

.pop{position:fixed;z-index:30;background:var(--paper);border:1.5px solid var(--fg);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:210px;max-height:90vh;overflow:auto}
.pop h4{margin:0;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt.color{width:40px;height:40px;border-radius:50%}
.opt.color i{width:24px;height:24px;border-radius:50%;display:block}
.opt.size{width:52px;height:40px}
.opt.size i{display:block;border-radius:50%;background:var(--fg)}
.opt.paperopt{width:64px;padding:6px 6px 5px;gap:4px;font:12px/1 var(--ui)}
.opt.paperopt canvas{width:50px;height:66px;display:block;outline:1px solid var(--soft)}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:11px 12px;font:500 14px/1 var(--ui);cursor:pointer;text-align:left}
.btn.armed,.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--paper)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;font:14px/1.3 var(--ui);cursor:pointer;padding:2px 0}
.toggle input{width:20px;height:20px;accent-color:var(--fg)}
.note{font:12px/1.45 var(--ui);color:var(--muted);max-width:240px;margin:0}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(235,235,230,.8);display:flex;align-items:flex-start;justify-content:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 40px);padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--paper);border:1.5px solid var(--fg);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{margin:0;font:600 18px/1.2 var(--ui)}
.nb-list{display:flex;flex-direction:column;gap:8px}
.nb-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer}
.nb-row.current{border-color:var(--fg)}
.cover{width:44px;height:58px;border-radius:2px;border:1px solid var(--fg);position:relative;overflow:hidden;
  background-image:radial-gradient(circle,#8f918b 1px,transparent 1.3px);background-size:7px 7px;background-position:3px 3px}
.nb-meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.nb-meta input{font:500 15px/1.3 var(--ui);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 5px;margin-left:-6px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
.nb-meta input:focus{border-color:var(--line);outline:none}
.nb-meta small{font:12px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);
  background:var(--fg);color:var(--paper);font:500 14px/1.3 var(--ui);padding:10px 16px;border-radius:4px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="page" id="page">
    <canvas id="cBg"></canvas><canvas id="cInk"></canvas><canvas id="cLive"></canvas>
    <div class="hint" id="hint" hidden><b>Blank page</b>Write with your Apple Pencil.<br>Swipe with a finger to turn pages.</div>
  </div>

  <div class="head" id="head">
    <button class="nbtitle" id="nbTitle">Notebook</button>
    <span class="status" id="status">Opening…</span>
  </div>

  <nav class="rail" id="rail" aria-label="Tools">
    <button class="tb" id="bRail" title="Hide tools" aria-label="Hide tools"><svg viewBox="0 0 24 24"><path d="M7 9h10M7 12h10M7 15h10"/></svg></button>
    <button class="tb" id="bNotebooks" title="Notebooks" aria-label="Notebooks"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="12" height="17" rx="1.5"/><path d="M19 6v13.5a1.5 1.5 0 0 1-1.5 1.5H8M7.5 8h5"/></svg></button>
    <div class="sep"></div>
    <button class="tb" data-tool="pen" title="Pen" aria-label="Pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.4L15.5 5.3a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8 4 20z"/><path d="M13.8 7l3.2 3.2"/></svg></button>
    <button class="tb" data-tool="marker" title="Highlighter" aria-label="Highlighter" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8.5 14.5l7.8-7.8a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8l-7.8 7.8z"/><path d="M8.5 14.5L6 17l1 1 2.5-.5M4 21h16"/></svg></button>
    <button class="tb" data-tool="eraser" title="Eraser" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 19.5h11M5.6 14.6l7.8-7.8a2 2 0 0 1 2.8 0l2.5 2.5a2 2 0 0 1 0 2.8L13 18.8a2 2 0 0 1-1.4.6H9.4a2 2 0 0 1-1.4-.6l-2.4-2.4a2 2 0 0 1 0-2.8zM9.5 10.7l5.3 5.3"/></svg></button>
    <button class="tb" id="bInk" title="Colour and thickness" aria-label="Colour and thickness"><span class="swatch" id="swatch"><i id="swatchDot"></i></span></button>
    <div class="sep"></div>
    <button class="tb" id="bUndo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 6L4.5 10.5 9 15M5 10.5h9.5a4.5 4.5 0 0 1 0 9H12"/></svg></button>
    <button class="tb" id="bRedo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 6l4.5 4.5L15 15M19 10.5H9.5a4.5 4.5 0 0 0 0 9H12"/></svg></button>
    <div class="grow"></div>
    <button class="tb" id="bPaper" title="Paper" aria-label="Paper"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><circle cx="9" cy="8.5" r=".6"/><circle cx="12" cy="8.5" r=".6"/><circle cx="15" cy="8.5" r=".6"/><circle cx="9" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="15" cy="12" r=".6"/><circle cx="9" cy="15.5" r=".6"/><circle cx="12" cy="15.5" r=".6"/><circle cx="15" cy="15.5" r=".6"/></svg></button>
    <button class="tb" id="bMore" title="More" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18" cy="12" r="1.1"/></svg></button>
    <div class="sep"></div>
    <button class="tb" id="bPrev" title="Previous page" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></svg></button>
    <span class="count" id="count">1/1</span>
    <button class="tb" id="bNext" title="Next page" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg></button>
    <button class="tb" id="bAdd" title="New page" aria-label="New page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
</div>

<div class="pop" id="popInk" hidden>
  <h4>Colour</h4><div class="row" id="colorRow"></div>
  <h4>Thickness</h4><div class="row" id="sizeRow"></div>
</div>
<div class="pop" id="popPaper" hidden>
  <h4>Paper for this page</h4><div class="row" id="paperRow"></div>
</div>
<div class="pop" id="popMore" hidden>
  <label class="toggle" for="fingerToggle">Draw with finger<input type="checkbox" id="fingerToggle"></label>
  <button class="btn" id="bImage">Save page as image</button>
  <button class="btn" id="bExport">Back up all notebooks</button>
  <button class="btn" id="bImport">Restore from backup</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <p class="note">Notes are stored on this iPad. Back up now and then to keep a copy in Files.</p>
  <button class="btn" id="bClear">Clear this page</button>
  <button class="btn" id="bDelPage">Delete this page</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Notebooks</h2>
      <button class="tb" id="bCloseSheet" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <button class="btn primary" id="bNewNb">New notebook</button>
    <div class="nb-list" id="nbList"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// Page space matches a reMarkable sheet: 1404 × 1872. The paper pattern continues past the sheet so the screen is paper edge to edge.
const PW = 1404, PH = 1872;
const PAPER = "#ebebe6";
const COLORS = { ink:"#111111", gray:"#6e706c", blue:"#3e5878", red:"#94493f", yellow:"#c7a743" };
const COLOR_NAMES = { ink:"Black", gray:"Grey", blue:"Blue", red:"Red", yellow:"Yellow" };
const SIZES = [2.4, 4.2, 7.5];
const MARK = 5.2;
const PAPERS = [["dots","Dots"],["blank","Blank"],["lined","Lined"],["grid","Grid"]];

const $ = id => document.getElementById(id);
const app = $("app"), page = $("page"), cBg = $("cBg"), cInk = $("cInk"), cLive = $("cLive");
const bg = cBg.getContext("2d"), ink = cInk.getContext("2d"), live = cLive.getContext("2d");

/* ---------- storage: IndexedDB on this device, localStorage as fallback ---------- */
const ls = {
  get(k){ try { const v = localStorage.getItem("paper." + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v){ try { localStorage.setItem("paper." + k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem("paper." + k); } catch {} }
};
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("paper-notebook", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction("kv", mode), req = fn(t.objectStore("kv"));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    async get(k){ try { return await run("readonly", s => s.get(k)); } catch { return ls.get(k); } },
    async set(k, v){ try { await run("readwrite", s => s.put(v, k)); } catch { ls.set(k, v); } },
    async del(k){ try { await run("readwrite", s => s.delete(k)); } catch {} ls.del(k); }
  };
})();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
const uid8 = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- state ---------- */
const S = { index:null, nb:null, pageIdx:0, pages:{}, undo:{}, redo:{}, tool:"pen", color:"ink", size:1, ready:false, fingerDraw:true, fingerExplicit:false };
const prefs = ls.get("prefs") || {};
S.tool = prefs.tool || "pen"; S.color = prefs.color || "ink"; S.size = prefs.size ?? 1;
if (prefs.fingerExplicit) { S.fingerExplicit = true; S.fingerDraw = !!prefs.fingerDraw; } else if (prefs.penSeen) S.fingerDraw = false;
if (prefs.railCollapsed) app.classList.add("collapsed");
const savePrefs = extra => { Object.assign(prefs, { tool:S.tool, color:S.color, size:S.size, fingerDraw:S.fingerDraw, fingerExplicit:S.fingerExplicit }, extra || {}); ls.set("prefs", prefs); };

/* ---------- stroke encoding ---------- */
function enc(p){
  const out = []; let lx = 0, ly = 0;
  for (let i = 0; i < p.length; i += 3) {
    const x = Math.round(p[i] * 2), y = Math.round(p[i+1] * 2);
    out.push(x - lx, y - ly, Math.round(p[i+2] * 99)); lx = x; ly = y;
  }
  return out.join(",");
}
function dec(d){
  if (!d) return [];
  const a = d.split(",").map(Number), out = new Array(a.length); let x = 0, y = 0;
  for (let i = 0; i + 2 < a.length; i += 3) { x += a[i]; y += a[i+1]; out[i] = x / 2; out[i+1] = y / 2; out[i+2] = a[i+2] / 99; }
  return out;
}
function bbox(s){
  const p = s.pts; let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (let i = 0; i < p.length; i += 3) { if (p[i] < a) a = p[i]; if (p[i] > c) c = p[i]; if (p[i+1] < b) b = p[i+1]; if (p[i+1] > d) d = p[i+1]; }
  s.bb = [a, b, c, d]; return s;
}
const fromDoc = o => bbox({ t:o.t, c:o.c, w:o.w, d:o.d, pts:dec(o.d) });
const pageToDoc = pg => ({ v:1, paper:pg.paper, strokes:pg.strokes.map(s => ({ t:s.t, c:s.c, w:s.w, d: s.d || (s.d = enc(s.pts)) })) });
const docToPage = (o, fb) => ({ paper: (o && o.paper) || fb, strokes: o && Array.isArray(o.strokes) ? o.strokes.map(fromDoc) : [] });

/* ---------- drawing ---------- */
const penW = (w, pr) => w * (0.32 + 1.1 * pr);
function drawStroke(ctx, s){
  const p = s.pts, n = p.length / 3; if (!n) return;
  ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = ctx.fillStyle = COLORS[s.c] || COLORS.ink;
  if (s.t === "m") {
    ctx.globalAlpha = 0.36; ctx.globalCompositeOperation = "multiply"; ctx.lineWidth = s.w * MARK;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    if (n === 1) ctx.lineTo(p[0] + 0.1, p[1]);
    for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(p[i*3], p[i*3+1], (p[i*3] + p[i*3+3]) / 2, (p[i*3+1] + p[i*3+4]) / 2);
    if (n > 1) ctx.lineTo(p[(n-1)*3], p[(n-1)*3+1]);
    ctx.stroke();
  } else if (n === 1) {
    ctx.beginPath(); ctx.arc(p[0], p[1], penW(s.w, p[2]) / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    let px = p[0], py = p[1];
    for (let i = 1; i < n; i++) {
      const x = p[i*3], y = p[i*3+1];
      const mx = i < n - 1 ? (x + p[i*3+3]) / 2 : x, my = i < n - 1 ? (y + p[i*3+4]) / 2 : y;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(x, y, mx, my);
      ctx.lineWidth = penW(s.w, (p[i*3-1] + p[i*3+2]) / 2); ctx.stroke();
      px = mx; py = my;
    }
  }
  ctx.restore();
}
const grain = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const g = c.getContext("2d"), im = g.createImageData(160, 160);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() < .5 ? 20 : 250; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = Math.random() < .5 ? 8 : 0; }
  g.putImageData(im, 0, 0); return c;
})();
// Draws in page units over [x0,x1]×[y0,y1]; upx = screen pixels per page unit (keeps lines at least 1px).
function drawPaper(ctx, kind, x0, y0, x1, y1, upx){
  ctx.save(); ctx.fillStyle = PAPER; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.strokeStyle = "rgba(17,17,17,.16)"; ctx.fillStyle = "rgba(17,17,17,.36)"; ctx.lineWidth = Math.max(1 / upx, 1.6);
  const g = 52;
  if (kind === "lined") {
    ctx.beginPath(); for (let y = 200; y <= y1; y += 66) if (y >= y0) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); } ctx.stroke();
    ctx.strokeStyle = "rgba(17,17,17,.12)"; ctx.beginPath(); ctx.moveTo(170, y0); ctx.lineTo(170, y1); ctx.stroke();
  } else if (kind === "grid") {
    ctx.beginPath();
    for (let x = Math.floor(x0 / g) * g; x <= x1; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / g) * g; y <= y1; y += g) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.globalAlpha = .8; ctx.stroke();
  } else if (kind === "dots") {
    const r = Math.max(0.75 / upx, 2.4); ctx.beginPath();
    for (let x = Math.floor(x0 / g) * g; x <= x1; x += g) for (let y = Math.floor(y0 / g) * g; y <= y1; y += g) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- view: sheet fills the width (top-aligned) in portrait, centred in landscape ---------- */
const V = { s:1, ox:0, oy:0, w:1, h:1, dpr:1 };
function fit(){

/* ---------- saving ---------- */

/* ---------- notebooks & pages ---------- */
function newNotebook(title){

  S.pages[nb.pages[0]] = { paper:"dots", strokes:[] };
  return nb;
}
async function loadPage(pid){

  return S.pages[pid];
}
async function openNotebook(id, idx){

}
async function goPage(i){

}
function updateNav(){

function addPage(){

function deletePage(){

  S.nb.pages.splice(S.pageIdx, 1); dirty.delete(pid);

function clearPage(){

/* ---------- undo ---------- */
function pushUndo(op){ const pid = S.nb.pages[S.pageIdx]; (S.undo[pid] ||= []).push(op); if (S.undo[pid].length > 300) S.undo[pid].shift(); S.redo[pid] = []; updateNav(); }
function applyOp(op, reverse){

  else if (op.a === "erase") {
    if (reverse) { for (const it of op.items.slice().sort((a, b) => a.i - b.i)) pg.strokes.splice(it.i, 0, it.s); }
    else { const set = new Set(op.items.map(it => it.s)); pg.strokes = pg.strokes.filter(s => !set.has(s)); }

function undo(){ const pid = S.nb && S.nb.pages[S.pageIdx], op = S.undo[pid] && S.undo[pid].pop(); if (!op) return; applyOp(op, true); (S.redo[pid] ||= []).push(op); updateNav(); }

/* ---------- input ---------- */
let active = null, cur = null, erasing = null, swipe = null, liveRaf = 0, eraserPos = null, lastPr = 0.5;

page.addEventListener("pointerdown", e => {

const POPS = ["popInk", "popPaper", "popMore"];

function togglePop(id, btn){

  pop.hidden = false;

let armed = null;

}
let toastTimer = 0;

for (const b of document.querySelectorAll("[data-tool]")) b.onclick = () => {

/* ---------- files out and in ---------- */
async function deliver(blob, filename){
  const file = new File([blob], filename, { type: blob.type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$("bImage").onclick = async () => {
  closePops(); const pg = curPage(); if (!pg) return;
  const c = document.createElement("canvas"); c.width = PW; c.height = PH; const x = c.getContext("2d");
  drawPaper(x, pg.paper, 0, 0, PW, PH, 1); for (const s of pg.strokes) drawStroke(x, s);
  c.toBlob(b => b && deliver(b, (S.nb.title || "Notebook").replace(/[^\w\- ]+/g, "") + " p" + (S.pageIdx + 1) + ".png"), "image/png");
};
$("bExport").onclick = async () => {
  closePops(); flushAll();
  const pages = {};
  for (const nb of S.index.notebooks) for (const pid of nb.pages) {
    const pg = S.pages[pid]; pages[pid] = pg ? pageToDoc(pg) : (await store.get("p_" + pid)) || null;
  }
  const data = { app: "paper-notebook", v: 1, exported: new Date().toISOString(), index: S.index, pages };
  deliver(new Blob([JSON.stringify(data)], { type: "application/json" }), "paper-backup-" + stamp() + ".json");
};
$("bImport").onclick = () => { closePops(); $("importFile").value = ""; $("importFile").click(); };
$("importFile").onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "paper-notebook" || !data.index || !Array.isArray(data.index.notebooks)) throw 0;
    let n = 0;
    for (const nb of data.index.notebooks) {
      for (const pid of nb.pages) { const d = data.pages && data.pages[pid]; if (d) { await store.set("p_" + pid, d); delete S.pages[pid]; } }
      const at = S.index.notebooks.findIndex(x => x.id === nb.id);
      if (at >= 0) S.index.notebooks[at] = nb; else S.index.notebooks.push(nb);
      n++;
    }
    saveIndex(); await openNotebook(S.nb.id, S.pageIdx);
    toast("Restored " + n + (n === 1 ? " notebook" : " notebooks"));
  } catch { toast("That file isn't a Paper backup."); }
};

    inp.onclick = e => e.stopPropagation();

/* ---------- boot ---------- */
async function boot(){
  $("fingerToggle").checked = S.fingerDraw;
  if (app.classList.contains("collapsed")) { $("bRail").setAttribute("aria-label", "Show tools"); $("bRail").title = "Show tools"; }
  setTool(S.tool); fit();
  const idx = await store.get("index");
  const fresh = !(idx && Array.isArray(idx.notebooks) && idx.notebooks.length);
  S.index = fresh ? { v:1, notebooks:[newNotebook("My notebook")] } : idx;
  if (fresh) saveIndex();
  S.ready = true;
  const want = ls.get("current");
  await openNotebook(S.index.notebooks.some(n => n.id === want) ? want : S.index.notebooks[0].id, 0);
  setStatus();
}
boot();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
